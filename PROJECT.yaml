schema_version: 1

project:
  name: RelayHub (Java)
  repository: relayhub-java
  abbreviation: RelayHub
  type: service
  lifecycle: active-development

purpose:
  summary: >-
    Event-driven data integration platform that relays data-change events from
    Source systems to Target systems without forcing either side to adopt a
    RelayHub-specific payload contract.
  problem: >-
    Point-to-point integrations couple systems directly, force full
    DELETE+INSERT or full UPSERT on small changes, silently drop failed
    deliveries with no retry/alerting, duplicate integration logic per system
    pair, and leave no reliable delivery history or replay mechanism when
    manual database correction becomes necessary.

supported_agents:
  initial:
    - claude-code
  policy: agent-agnostic-core
  entrypoint: AGENTS.md   # sole adapter for every supported agent — see agent-dev-starter's ADR-0011

# Prose definitions for every principle below now live in .specify/memory/constitution.md
# (see agent-dev-starter's ADR-0013) — no bare name is defined only here.
principles:
  - repository-first-context
  - agent-agnostic-core
  - thin-agent-adapters
  - explicit-architecture-decisions
  - minimal-task-prompts
  - evidence-before-change
  - deterministic-quality-gates-when-implemented
  - external-contract-flexibility-over-relayhub-envelope
  - reliability-over-feature-count
  - modular-monolith-before-distribution

current_phase:
  id: phase-6-integration-platform-overhaul
  status: active
  goal: >-
    The original design roadmap (Specs 001-004) and the demo-observability
    extension are built, verified, and live at
    relayhub-java.developer.cleanbrain.me. The admin console (Spec 005) grew
    through sustained maintainer-driven iteration (Spec 006 field registry,
    SSE topology view, admin hard delete, dark theme — see
    docs/status/current-state.md's "phase-5-console-iteration" history), then
    the integration-platform domain-model overhaul (2026-09-30) split
    per-endpoint Target contracts out of the flat original model, replaced
    the blocking retry loop with a non-blocking scheduled one, reworked the
    admin console into a List -> Detail IA, and added field-registry
    validation + real API_KEY authentication. See
    docs/architecture/domain-model.md for the current entity model and
    docs/status/current-state.md for the current detailed, dated list.

standards:
  agents_md: AGENTS.md
  spec_kit:
    # Pinned by agent-dev-starter's ADR-0010; NOT yet actually installed in this repository
    # (no working Python/uv/pip toolchain available as of this migration) — see
    # docs/status/current-state.md, "Known constraints". Bump only via a new ADR.
    pinned_version: specify-cli==1.0.8
    memory: .specify/memory/
  skills:
    claude_code: .claude/skills/

context:
  human_entrypoint: README.md
  agent_entrypoint: AGENTS.md
  specify_constitution: .specify/memory/constitution.md
  documentation_policy: .ai/constitution/documentation-policy.md
  product: docs/product/
  architecture: docs/architecture/
  decisions: docs/decisions/
  current_state: docs/status/current-state.md
  specs: specs/   # this project's own pre-Spec-Kit specs/001-006 tree — real content, not yet
                   # migrated into Spec Kit's own specs/<NNN-feature>/ structure (pending a
                   # real `specify init` run; see docs/status/current-state.md)

delivery:
  implementation_present: true
  cli_present: false
  automation_present: false
