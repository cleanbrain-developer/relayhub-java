spring:
  datasource:
    url: "jdbc:h2:mem:relayhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # Flyway migrations are hand-written for Postgres (see db/migration/) and are not exercised
  # against H2 — the "test" profile keeps ddl-auto: create-drop instead, same as before Flyway.
  # PostgresKafkaIntegrationTest (real Postgres) is what actually runs the migrations.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

# No Zipkin container in tests — sampling off keeps test logs free of background export errors.
management:
  tracing:
    sampling:
      probability: 0.0
