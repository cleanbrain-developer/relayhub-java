spring:
  datasource:
    url: "jdbc:h2:mem:relayhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # Flyway migrations are hand-written for Postgres (see db/migration/) and are not exercised
  # against H2 — the "test" profile keeps ddl-auto: create-drop instead, same as before Flyway.
  # PostgresKafkaIntegrationTest (real Postgres) is what actually runs the migrations.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

# No Zipkin container in tests — sampling off keeps test logs free of background export errors.
management:
  tracing:
    sampling:
      probability: 0.0

relayhub:
  dlq:
    # An hour, not the 30s production default: @SpringBootTest contexts are cached and reused
    # across test classes, so the cumulative wall-clock lifetime of one context across a full
    # `./gradlew test` run can exceed 30s, letting the real @Scheduled trigger fire in the
    # background mid-test against another test's still-in-progress DLQ scenario (e.g. replaying a
    # delivery DlqReplayIdempotencyTest hasn't flipped its WireMock stub back to success for yet).
    # Tests that need the scheduler's actual replay logic call
    # DlqAutoReplayScheduler.replayDeadDeliveries() directly instead of waiting on this interval —
    # see DlqAutoReplaySchedulerTest.
    auto-replay-interval-ms: 3600000
