spring:
  application:
    name: relayhub
  datasource:
    url: jdbc:postgresql://localhost:5432/relayhub
    username: relayhub
    password: relayhub
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (src/main/resources/db/migration/) owns the schema now — see ADR-0004. Hibernate
      # only validates entities against it; it never generates or alters DDL itself in this profile.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: relayhub-delivery-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: me.cleanbrain.relayhub.delivery
        spring.json.value.default.type: me.cleanbrain.relayhub.delivery.DeliveryTaskMessage

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # 1.0 = trace every request. Fine for a local/personal-scale service; would need dialing
      # down before any real traffic volume — see specs/004-observability/spec.md.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

server:
  port: 8080

logging:
  level:
    me.cleanbrain.relayhub: INFO
