<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayHub Console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applies the saved theme (or dark, the default — see src/theme.ts) synchronously, before
      // first paint, so there's no flash of the light theme while React loads.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("relayhub-console-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {
          // Private-browsing / storage-blocked — keep the dark default.
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
