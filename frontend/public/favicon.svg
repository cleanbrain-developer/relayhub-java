<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art favicon (maintainer-supplied reference image, 2026-09-13): two figures with a
       crate between them, on a light-blue/grey scene. Hand-authored as a 16x16 grid of rects to
       match the source's blocky pixel-art style, not a photographic trace. -->
  <rect width="16" height="16" fill="#bfe6f5"/>
  <rect x="0" y="13" width="16" height="3" fill="#8a8a8a"/>

  <!-- left figure: brown hair, white/red top, blue pants -->
  <rect x="2" y="2" width="4" height="3" fill="#6b4a3a"/>
  <rect x="2" y="5" width="1" height="2" fill="#6b4a3a"/>
  <rect x="5" y="5" width="1" height="2" fill="#6b4a3a"/>
  <rect x="3" y="5" width="2" height="2" fill="#f2c9a0"/>
  <rect x="2" y="7" width="4" height="3" fill="#ffffff"/>
  <rect x="2" y="7" width="1" height="3" fill="#d94f4f"/>
  <rect x="5" y="7" width="1" height="1" fill="#d94f4f"/>
  <rect x="5" y="9" width="1" height="1" fill="#f2c9a0"/>
  <rect x="2" y="9" width="1" height="1" fill="#d94f4f"/>
  <rect x="2" y="10" width="4" height="2" fill="#3a5fa0"/>

  <!-- crate -->
  <rect x="7" y="11" width="2" height="2" fill="#c0392b"/>

  <!-- right figure: black hair, orange top -->
  <rect x="10" y="2" width="3" height="2" fill="#1c1c1c"/>
  <rect x="10" y="4" width="3" height="2" fill="#f2c9a0"/>
  <rect x="9" y="6" width="4" height="6" fill="#e0952b"/>
  <rect x="8" y="8" width="1" height="1" fill="#f2c9a0"/>
  <rect x="10" y="12" width="2" height="1" fill="#ffffff"/>
</svg>
