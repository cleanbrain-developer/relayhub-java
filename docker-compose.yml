services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayhub
      POSTGRES_USER: relayhub
      POSTGRES_PASSWORD: relayhub
    ports:
      - "5432:5432"
    volumes:
      - relayhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker (no Zookeeper). The apache/kafka image ships a default
  # single-node config that just works for local dev when run with no extra env vars.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"

  # Local-dev-only observability stack (Spec 004) — scrapes the app on the host via
  # host.docker.internal, so the app itself is NOT part of this Compose network.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  # Simulated Source/Target systems for the demo-profile scenario (see DemoDataSeeder) —
  # continuously generates flight-status events into the app's Ingress API and serves the two
  # Targets it seeds. Assumes relayhub-demo-systems is checked out as a sibling repo under the
  # same vscode/ root (../../node/relayhub-demo-systems); override `build.context` if that's not
  # the case on your machine. Opt-in via the "demo" Compose profile so it doesn't start on a plain
  # `docker compose up -d` — run `docker compose --profile demo up -d` alongside the app's own
  # `--spring.profiles.active=demo`. The app itself runs on the host (not in Compose, see the
  # Prometheus note above), so this container reaches it via host.docker.internal.
  demo-systems:
    build:
      context: ../../node/relayhub-demo-systems
    profiles: ["demo"]
    ports:
      - "9500:9500"
    environment:
      RELAYHUB_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  relayhub-postgres-data:
