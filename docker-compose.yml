services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayhub
      POSTGRES_USER: relayhub
      POSTGRES_PASSWORD: relayhub
    ports:
      - "5432:5432"
    volumes:
      - relayhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker (no Zookeeper). The apache/kafka image ships a default
  # single-node config that just works for local dev when run with no extra env vars.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"

volumes:
  relayhub-postgres-data:
